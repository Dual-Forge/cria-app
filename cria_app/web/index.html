<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Acompanhamento de gestação e enxoval do bebê.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Cria">
  <link rel="apple-touch-icon" href="icons/Iczon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Cria</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <style>
    body {
      margin: 0;
      background: linear-gradient(135deg, #fce4ec 0%, #f3e5f5 100%);
      font-family: sans-serif;
    }
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(135deg, #fce4ec 0%, #f3e5f5 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #9c27b0;
      z-index: 99999;
      transition: opacity 0.4s ease-out;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(156, 39, 176, 0.2);
      border-top-color: #9c27b0;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <div id="loading">
    <div class="spinner"></div>
    <p>Carregando Cria...</p>
  </div>
  <script>
    (function() {
      function removeLoading() {
        const loading = document.getElementById('loading');
        if (loading && loading.style.display !== 'none') {
          loading.style.opacity = '0';
          setTimeout(function() {
            loading.style.display = 'none';
          }, 400);
        }
      }

      // 1. Listen for DOM mutations when Flutter engine renders elements
      const observer = new MutationObserver(function(mutations) {
        for (const m of mutations) {
          for (const node of m.addedNodes) {
            if (node.nodeType === 1) {
              const tag = node.tagName ? node.tagName.toLowerCase() : '';
              if (tag === 'flutter-view' || tag === 'flt-glass-pane' || tag === 'canvas' || (node.classList && node.classList.contains('flt-glass-pane'))) {
                removeLoading();
                observer.disconnect();
                return;
              }
            }
          }
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });

      // 2. Safety fallback: remove after 3.5 seconds max so user is never stuck
      setTimeout(removeLoading, 3500);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
