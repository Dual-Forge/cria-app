# ============================================================
# Supabase Edge Functions — Cria
# ============================================================
# MP-01: funções do Mercado Pago (create-checkout-api,
# check-payment-status, mp-webhook) foram REMOVIDAS do produto.
# Apenas a função de IA (ai-proxy) permanece, com verify_jwt = true
# para exigir usuário autenticado antes de atingir o handler.
# ============================================================

[functions.ai-proxy]
enabled = true
verify_jwt = true
import_map = "./functions/ai-proxy/deno.json"
entrypoint = "./functions/ai-proxy/index.ts"